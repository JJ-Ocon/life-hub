<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Budget</title>
<meta name="description" content="Ausgaben erfassen und Budgets pro Kategorie im Blick behalten.">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header id="topbar" class="topbar">
    <button class="topbar__back" id="topbar-back" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="topbar__title" id="topbar-title">Start</h1>
    <div class="topbar__actions" id="topbar-actions"></div>
    <a class="icon-btn topbar__hub-link" href="../#apps" aria-label="Zur Startseite" title="Zur Startseite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </a>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
    <a class="tab" href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 10v9h12v-9"/></svg>
      <span>Start</span>
    </a>
    <a class="tab" href="#/expenses" data-tab="expenses">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span>Kontostand</span>
    </a>
    <a class="tab" href="#/categories" data-tab="categories">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
      <span>Kategorien</span>
    </a>
    <a class="tab" href="#/savings" data-tab="savings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.9 4.9l2.8 2.8"/><path d="M16.3 16.3l2.8 2.8"/><circle cx="12" cy="12" r="6"/></svg>
      <span>Sparen</span>
    </a>
    <a class="tab" href="#/stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10"/><path d="M12 19V5"/><path d="M19 19v-6"/></svg>
      <span>Statistik</span>
    </a>
    <a class="tab" href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>Mehr</span>
    </a>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font-family:system-ui">Diese App benötigt JavaScript.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>

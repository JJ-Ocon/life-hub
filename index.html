<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Life Hub</title>
<meta name="description" content="Zentrale Startseite fuer die persoenlichen Apps.">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="fitness/icons/icon-192.png">
<link rel="apple-touch-icon" href="fitness/icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Life Hub</h1>
      <p class="subtitle">Deine Apps an einem Ort</p>
    </div>
    <a class="header-link" href="calendar.html" aria-label="Kalender">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
    </a>
  </header>

  <div class="app-grid">
    <a class="app-card" href="fitness/">
      <img class="app-card__icon" src="fitness/icons/icon-192.png" alt="">
      <div>
        <div class="app-card__name">Trainingslog</div>
        <div class="app-card__desc">Routinen, Workouts, Fortschritt</div>
      </div>
    </a>
    <a class="app-card" href="budget/">
      <img class="app-card__icon" src="budget/icons/icon.svg" alt="">
      <div>
        <div class="app-card__name">Budget</div>
        <div class="app-card__desc">Ausgaben & Budgets pro Kategorie</div>
      </div>
    </a>
    <a class="app-card" href="meal/">
      <img class="app-card__icon" src="meal/icons/icon.svg" alt="">
      <div>
        <div class="app-card__name">Meal Planning</div>
        <div class="app-card__desc">Rezepte, Wochenplan, Einkaufsliste</div>
      </div>
    </a>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

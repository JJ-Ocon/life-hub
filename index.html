<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Life Hub</title>
<meta name="description" content="Zentrale Startseite fuer die persoenlichen Apps.">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="fitness/icons/icon-192.png">
<link rel="apple-touch-icon" href="fitness/icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Life Hub</h1>
    <p class="subtitle">Deine Apps an einem Ort</p>
  </header>

  <div class="app-grid">
    <a class="app-card" href="fitness/">
      <img class="app-card__icon" src="fitness/icons/icon-192.png" alt="">
      <div>
        <div class="app-card__name">Trainingslog</div>
        <div class="app-card__desc">Routinen, Workouts, Fortschritt</div>
      </div>
    </a>
    <div class="app-card app-card--placeholder">
      <div class="app-card__icon">💰</div>
      <div>
        <div class="app-card__name">Budget</div>
        <div class="app-card__desc">Geplant</div>
      </div>
    </div>
    <div class="app-card app-card--placeholder">
      <div class="app-card__icon">🍽️</div>
      <div>
        <div class="app-card__name">Meal Planning</div>
        <div class="app-card__desc">Geplant</div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

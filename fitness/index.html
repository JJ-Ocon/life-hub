<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Trainingslog</title>
<meta name="description" content="Workouts planen, durchführen und den Fortschritt über die Zeit verfolgen.">
<meta name="theme-color" content="#11151c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header id="topbar" class="topbar">
    <button class="topbar__back" id="topbar-back" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="topbar__title" id="topbar-title">Start</h1>
    <div class="topbar__actions" id="topbar-actions"></div>
    <a class="icon-btn topbar__hub-link" href="../" aria-label="Zur Startseite" title="Zur Startseite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </a>
  </header>

  <div class="session-bar" id="session-bar" hidden>
    <span class="session-bar__dot" aria-hidden="true"></span>
    <span class="session-bar__text">Training läuft</span>
    <span class="session-bar__time" id="session-bar-time">00:00</span>
    <button class="session-bar__btn" id="session-bar-open">Öffnen</button>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
    <a class="tab" href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 10v9h12v-9"/></svg>
      <span>Start</span>
    </a>
    <a class="tab" href="#/routines" data-tab="routines">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span>Routinen</span>
    </a>
    <a class="tab" href="#/calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
      <span>Kalender</span>
    </a>
    <a class="tab" href="#/stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10"/><path d="M12 19V5"/><path d="M19 19v-6"/></svg>
      <span>Statistik</span>
    </a>
    <a class="tab" href="#/body" data-tab="body">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="2.6"/><path d="M12 9v7"/><path d="M7 11h10"/><path d="M9 20l3-4 3 4"/></svg>
      <span>Körper</span>
    </a>
    <a class="tab" href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>Mehr</span>
    </a>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font-family:system-ui">Diese App benötigt JavaScript.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Job</title>
<meta name="description" content="Berufliche Kontakte, Termine und leichtes CRM.">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header id="topbar" class="topbar">
    <button class="topbar__back" id="topbar-back" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="topbar__title" id="topbar-title">Kontakte</h1>
    <div class="topbar__actions" id="topbar-actions"></div>
    <a class="icon-btn topbar__hub-link" href="../" aria-label="Zur Startseite" title="Zur Startseite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </a>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
    <a class="tab" href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
      <span>Kontakte</span>
    </a>
    <a class="tab" href="#/appointments" data-tab="appointments">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
      <span>Termine</span>
    </a>
    <a class="tab" href="#/calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 5h18"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M7 14h2"/><path d="M11 14h2"/><path d="M15 14h2"/></svg>
      <span>Kalender</span>
    </a>
    <a class="tab" href="#/network" data-tab="network">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 8.2l2.3 8.3"/><path d="M15.8 8.2l-2.3 8.3"/><path d="M8.5 7h7"/></svg>
      <span>Netzwerk</span>
    </a>
    <a class="tab" href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>Mehr</span>
    </a>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font-family:system-ui">Diese App benötigt JavaScript.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
